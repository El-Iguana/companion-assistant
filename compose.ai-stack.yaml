# Linux with ai-stack: join its "ai-net" network and reach its koboldcpp by name.
# `stack up` (or `stack on`) creates the network.
#
#   podman compose -f compose.yaml -f compose.ai-stack.yaml up -d
#
# `stack companion-assistant` does the same without compose (run-podman.sh), in
# a container named "companion-assistant" — run one or the other, not both.

services:
  companion-assistant:
    environment:
      KOBOLD_URL: http://koboldcpp:5001
    networks:
      - ai-net

networks:
  ai-net:
    external: true
