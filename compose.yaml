# Cantinero — Docker Compose or Podman Compose, on Linux, Windows or macOS.
# See INSTALL.md. Settings come from .env (copy .env.example).
#
#   docker compose up -d          (or: podman compose up -d)
#   docker compose logs companion-assistant  # the first-run ADMIN password is here
#
# Cantinero needs a KoboldCPP to chat with (and optionally a ComfyUI for
# sprites). By default it looks for both on this computer, through
# host.docker.internal. Add-ons, stacked with -f or COMPOSE_FILE in .env:
#   compose.koboldcpp.yaml      KoboldCPP in a container next to Cantinero
#   compose.gpu.docker.yaml     …with the NVIDIA GPU, under Docker
#   compose.gpu.podman.yaml     …with the NVIDIA GPU, under Podman
#   compose.ai-stack.yaml       join ai-stack's "ai-net" (Linux, ai-stack users)
# Instead of this file: compose.host-network.yaml (Linux, backends on
# 127.0.0.1 only), on its own.
#
# On the ai-stack workstation `stack companion-assistant` (run-podman.sh) is still
# the usual way in; this file does not replace it.

name: companion-assistant

services:
  companion-assistant:
    image: localhost/companion-assistant:latest
    build:
      context: .
      dockerfile: Containerfile
    container_name: companion-assistant
    restart: unless-stopped
    ports:
      # This computer only: the login refuses any other address (INSTALL.md, "Other
      # devices"). Same number inside and out — it is also the page's origin.
      - "127.0.0.1:${PANTHEON_PORT:-7867}:${PANTHEON_PORT:-7867}"
    extra_hosts:
      # Docker Desktop and Podman define this name already; Docker Engine on
      # Linux needs it spelled out.
      - "host.docker.internal:host-gateway"
    environment:
      PANTHEON_PORT: ${PANTHEON_PORT:-7867}
      KOBOLD_URL: ${KOBOLD_URL:-http://host.docker.internal:5001}
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      # The image is UTC; timestamps and "what time is it?" follow this.
      TZ: ${TZ:-UTC}
      # Read once, when the first account is created. Empty = a random one,
      # printed in the log and written to data/auth/INITIAL_PASSWORD.
      COMPANION_ADMIN_PASSWORD: ${PANTHEON_ADMIN_PASSWORD:-}
    volumes:
      # Accounts, characters, chats, memories — everything. Back it up.
      - companion-assistant-data:/app/data
      # Piper voices (.onnx + .onnx.json), optional. Kokoro is built in.
      - ${PIPER_VOICES_DIR:-./voices}:/app/models/piper:ro,z
    healthcheck:
      # Public and independent of the backends, so "unhealthy" means Cantinero itself is down.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:${PANTHEON_PORT:-7867}/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  companion-assistant-data:
    name: companion-assistant-data
