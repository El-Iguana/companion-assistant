<!doctype html>
<!-- Avatar harness (Phase 3a).
     Exercises static/js/vtuber.mjs on its own: no login, no chat, no card needed.
     Track B has not produced a .vrm yet, so the default here is the opt-in
     placeholder path — the only way to drive the renderer before a model exists.
     Open http://localhost:7861/static/avatar-test.html -->
<html><head><meta charset="utf-8"><title>avatar harness</title>
<style>
  html,body{margin:0;background:#20202a;height:100%;color:#ddd;font:13px system-ui}
  #wrap{position:relative;width:100vw;height:100vh}
  #avatar-canvas{position:absolute;right:12px;bottom:0;height:80vh;width:40%}
  #log{position:absolute;left:10px;top:10px;font-family:ui-monospace,monospace;
       white-space:pre;line-height:1.5}
  .ok{color:#7ddc7d}.bad{color:#ff8080}.dim{color:#9a9aa8}
  #live{position:absolute;left:10px;bottom:60px;font-family:ui-monospace,monospace;
        font-size:14px;background:#0006;padding:8px 12px;border-radius:8px}
  #ctl{position:absolute;left:10px;bottom:14px;background:#0006;padding:8px 12px;
       border-radius:8px;font-family:ui-monospace,monospace;font-size:13px}
  #ctl input{vertical-align:middle;width:180px}
  #models{position:absolute;right:12px;top:10px;background:#0006;padding:8px 10px;
          border-radius:8px;font:13px ui-monospace,monospace;max-width:32%}
  #models button{display:block;width:100%;margin:3px 0;cursor:pointer;
                 background:#3a3a4a;color:#ddd;border:1px solid #555;border-radius:5px;
                 padding:4px 8px;font:12px ui-monospace,monospace;text-align:left}
  #models button:hover{background:#4a4a5e}
</style>
<script type="importmap">
{"imports":{"three":"/static/vendor/three.module.js",
            "three/addons/":"/static/vendor/",
            "@pixiv/three-vrm":"/static/vendor/three-vrm.module.js"}}
</script></head>
<body><div id="wrap">
  <canvas id="avatar-canvas"></canvas>
  <div id="log"></div>
  <div id="ctl">
    <div>arm rest <input id="arm" type="range" min="-90" max="90" step="2" value="72">
      <span id="armv">72</span>°
      <span class="dim">— 0 = T-pose. If arms go UP, the sign is wrong.</span></div>
    <div>idle gain <input id="gain" type="range" min="0" max="15" step="0.5" value="2">
      <span id="gainv">2</span>
      <span class="dim">— exaggerate breath/sway to confirm the rig is driven</span></div>
    <div>mouth gain <input id="mgain" type="range" min="0" max="20" step="0.5" value="6">
      <span id="mgainv">6</span>
      <button id="speak" type="button">simulate speech</button>
      <span class="dim">— no TTS here, so this feeds a speech-shaped amplitude</span></div>
  </div>
</div>
<script type="module">
const el = document.getElementById("log");
const log = (m, cls) => el.innerHTML += `<span class="${cls||''}">${m}</span>\n`;
window.addEventListener("error", (e) => log("ERROR: " + e.message, "bad"));
window.addEventListener("avatar:active", (e) =>
  log("avatar:active -> " + e.detail.active, e.detail.active ? "ok" : ""));
window.addEventListener("avatar:error", (e) => {
  log("AVATAR ERROR [" + e.detail.where + "]: " + e.detail.message, "bad");
  if (e.detail.stack) log(e.detail.stack.split("\n").slice(0, 4).join("\n"), "bad");
});
window.addEventListener("unhandledrejection", (e) =>
  log("UNHANDLED REJECTION: " + (e.reason && e.reason.message || e.reason), "bad"));
try {
  await import("/static/js/vtuber.mjs");
  log("module imported", "ok");
  document.getElementById("avatar-canvas").hidden = false;
  // ?card=<id> loads that card's real .vrm through the API. Same-origin, so your
  // existing login cookie rides along — be logged in in this browser first.
  // No ?card= falls back to the procedural placeholder.
  const qs = new URLSearchParams(location.search);
  const cardId = qs.get("card");
  const vrmName = qs.get("vrm");

  // Model switcher: every .vrm in data/vrm/, click to load. Beats editing a card
  // just to look at a model.
  try {
    const models = await (await fetch("/api/vrm")).json();
    if (Array.isArray(models) && models.length) {
      const bar = document.createElement("div");
      bar.id = "models";
      bar.innerHTML = "<span class='dim'>models:</span> ";
      for (const m of models) {
        const a = document.createElement("button");
        a.type = "button";
        a.textContent = `${m.name} (${(m.size / 1048576).toFixed(0)}MB)`;
        a.onclick = () => {
          log("loading " + m.name);
          window.dispatchEvent(new CustomEvent("avatar:card",
            { detail: { id: "preview", url: "/api/vrm/" + encodeURIComponent(m.name) } }));
        };
        bar.appendChild(a);
      }
      document.getElementById("wrap").appendChild(bar);
    }
  } catch (e) { log("could not list models: " + e, "bad"); }

  if (vrmName) {
    window.dispatchEvent(new CustomEvent("avatar:card",
      { detail: { id: "preview", url: "/api/vrm/" + encodeURIComponent(vrmName) } }));
    log("requested model " + vrmName);
  } else if (cardId) {
    window.dispatchEvent(new CustomEvent("avatar:card",
      { detail: { id: cardId, hasVrm: true } }));
    log("requested REAL vrm for card " + cardId);
  } else {
    window.dispatchEvent(new CustomEvent("avatar:card",
      { detail: { id: "harness", hasVrm: false, placeholder: true } }));
    log("requested placeholder (add ?card=<id> to load a real .vrm)");
  }
  // A one-shot delta lies: the renderer pauses when the tab is hidden (by design),
  // so alt-tabbing to copy the result reads as a stall. Live panel instead — look
  // at it while the page is focused.
  const panel = document.createElement("div");
  panel.id = "live";
  document.getElementById("wrap").appendChild(panel);
  let prev = 0, prevT = performance.now(), pauses = 0;
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) pauses++;
    log("visibility -> " + (document.hidden ? "hidden (renderer pauses by design)"
                                            : "visible (renderer resumes)"));
  });
  setInterval(() => {
    const st = window.__avatarStats || { frames: 0 };
    const now = performance.now();
    const fps = (st.frames - prev) / ((now - prevT) / 1000);
    prev = st.frames; prevT = now;
    const live = !document.hidden;
    panel.innerHTML =
      `<b>${live ? (fps > 5 ? "LOOP LIVE" : "LOOP STALLED") : "TAB HIDDEN"}</b>` +
      `  ${fps.toFixed(1)} fps · ${st.frames} frames · model=${st.model || "?"}` +
      `<br><span class="dim">idle: ${st.idle || "?"}` +
      ` · chest ${(st.chestDeg || 0).toFixed(2)}°` +
      ` · gain ${(st.gain || 0).toFixed(1)}` +
      ` · arms ${(st.armDeg ?? 0)}° (sign ${st.armSign > 0 ? "+" : st.armSign < 0 ? "-" : "?"})` +
      ` · mouth ${((st.mouth || 0) * 100).toFixed(0)}%` +
      ` · pauses ${pauses}</span>`;
    panel.className = live ? (fps > 5 ? "ok" : "bad") : "";
  }, 500);
  setTimeout(() => {
    const c = document.getElementById("avatar-canvas");
    const painted = c.width > 0 && c.height > 0;
    log("canvas backing: " + c.width + "x" + c.height, painted ? "ok" : "bad");
    const st = window.__avatarStats || {};
    log("RENDERED frames    : " + (st.frames | 0) + "  (model: " + (st.model || "?") + ")",
        (st.frames | 0) > 20 ? "ok" : "bad");
    log("\nWatch the panel bottom-left while this tab is FOCUSED.", "");
  const gs = document.getElementById("gain"), gv = document.getElementById("gainv");
  gs.addEventListener("input", () => {
    gv.textContent = gs.value;
    if (window.__avatarStats) window.__avatarStats.gain = Number(gs.value);
  });
  const ms = document.getElementById("mgain"), mv = document.getElementById("mgainv");
  ms.addEventListener("input", () => {
    mv.textContent = ms.value;
    if (window.__avatarStats) window.__avatarStats.mouthGain = Number(ms.value);
  });
  // Speech-shaped, not a sine: ~4 Hz syllables inside phrases, with gaps between,
  // so the attack/release filter and the prosody envelope are actually exercised.
  const sb = document.getElementById("speak");
  let sim = null, t0 = 0;
  sb.addEventListener("click", () => {
    if (sim) { clearInterval(sim); sim = null; sb.textContent = "simulate speech"; return; }
    t0 = performance.now(); sb.textContent = "stop simulation";
    sim = setInterval(() => {
      const t = (performance.now() - t0) / 1000;
      const phrase = (t % 3.4) < 2.4 ? 1 : 0;
      const syl = Math.pow(Math.abs(Math.sin(t * Math.PI * 4)), 1.5);
      const amp = phrase * syl * (0.09 + Math.random() * 0.05);
      window.dispatchEvent(new CustomEvent("avatar:speak", { detail: { amp } }));
    }, 33);
  });

  const as = document.getElementById("arm"), av = document.getElementById("armv");
  as.addEventListener("input", () => {
    av.textContent = as.value;
    if (window.__avatarStats) window.__avatarStats.armDeg = Number(as.value);
  });
    log(painted && frames > 30
        ? "\n3a looks healthy — " + (cardId ? "the avatar should be on screen."
                                            : "you should see a slowly turning figure.")
        : "\nsomething is wrong; check the console.", painted && frames > 30 ? "ok" : "bad");
  }, 2000);
} catch (e) { log("IMPORT FAILED: " + e, "bad"); }
</script></body></html>
